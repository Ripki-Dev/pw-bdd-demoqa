name: Playwright E2E Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment"
        required: true
        type: choice
        default: dev
        options: [DEV, STG, PRD]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Convert BDD tests to Playwright format
        run: npx bddgen


      - name: Run Playwright tests
        env:
          BASE_URL_DEV: ${{ secrets.BASE_URL_DEV }}
          BASE_URL_STG: ${{ secrets.BASE_URL_STG }}
          BASE_URL_PROD: ${{ secrets.BASE_URL_PROD }}
        run: |
          TARGET_ENV=${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'dev' }}
          echo "Running tests on: $TARGET_ENV"
          npx playwright test --project=$TARGET_ENV

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
